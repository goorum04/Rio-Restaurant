<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rio">
  <defs>
    <radialGradient id="rioDisc" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#1e335a"/>
      <stop offset="100%" stop-color="#0d1830"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#rioDisc)"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#d4b06a" stroke-width="1.5"/>
  <!-- Moroccan 8-point star (khatam): two overlapped rotated squares -->
  <g fill="none" stroke="#d4b06a" stroke-width="1.3" stroke-linejoin="round" opacity="0.85">
    <rect x="13.5" y="13.5" width="37" height="37" transform="rotate(0 32 32)"/>
    <rect x="13.5" y="13.5" width="37" height="37" transform="rotate(45 32 32)"/>
  </g>
  <!-- Serif R monogram -->
  <text x="32" y="42.5" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30" font-weight="700" fill="#e6cf9a">R</text>
</svg>
